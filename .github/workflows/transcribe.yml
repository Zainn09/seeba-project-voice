name: Transcribe voices (Whisper Urdu ASR)

# Batch speech-to-text. Each matrix job transcribes one chunk of voice
# numbers into transcription/results/<shard>.jsonl; the collect job commits
# all shards back to the branch this workflow was launched from.
# Originals in Voices/ and text_voices.docx are only ever read.
#
# How to start a run from a feature branch: edit
# transcription/run_request.json and push (that file is the push trigger,
# because workflow_dispatch requires this file to exist on the default
# branch). Once merged to main, "Run workflow" (workflow_dispatch) also works.
# The collect job only commits results/*.jsonl, which does not match the
# trigger path, so runs never retrigger themselves.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "faster-whisper model (tiny/base/small/medium/large-v3)"
        default: "small"
      start:
        description: "First voice number"
        default: "151"
      end:
        description: "Last voice number"
        default: "500"
      only:
        description: "Comma-separated voice numbers (overrides start/end; for tests)"
        default: ""
      chunk_size:
        description: "Voices per parallel job"
        default: "42"
      language:
        description: "ur = force Urdu, auto = detect"
        default: "ur"
      skip_existing:
        description: "Skip voices already transcribed in text_voices.docx (true/false)"
        default: "true"
  push:
    paths:
      - "transcription/run_request.json"

permissions:
  contents: write

concurrency:
  group: transcribe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      model: ${{ steps.plan.outputs.model }}
      language: ${{ steps.plan.outputs.language }}
      skip_existing: ${{ steps.plan.outputs.skip_existing }}
      no_vad: ${{ steps.plan.outputs.no_vad }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_MODEL: ${{ inputs.model }}
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
          IN_ONLY: ${{ inputs.only }}
          IN_CHUNK: ${{ inputs.chunk_size }}
          IN_LANG: ${{ inputs.language }}
          IN_SKIP: ${{ inputs.skip_existing }}
        run: |
          python3 - <<'PY'
          import json, os
          if os.environ["EVENT"] == "push":
              req = json.load(open("transcription/run_request.json", encoding="utf-8"))
              p = {"model": req.get("model", "small"), "start": int(req.get("start", 151)),
                   "end": int(req.get("end", 500)), "only": (req.get("only") or "").strip(),
                   "chunk_size": int(req.get("chunk_size", 42)),
                   "language": req.get("language", "ur"),
                   "skip_existing": str(req.get("skip_existing", True)).lower()}
              print("Run request (push):", p, "| note:", req.get("note", ""))
          else:
              p = {"model": os.environ["IN_MODEL"] or "small",
                   "start": int(os.environ["IN_START"] or 151),
                   "end": int(os.environ["IN_END"] or 500),
                   "only": (os.environ.get("IN_ONLY") or "").strip(),
                   "chunk_size": int(os.environ["IN_CHUNK"] or 42),
                   "language": os.environ["IN_LANG"] or "ur",
                   "skip_existing": (os.environ["IN_SKIP"] or "true").lower()}
              print("Run request (dispatch):", p)
          if p["only"]:
              shard = "test_only"
              if os.environ["EVENT"] == "push":
                  shard = json.load(open("transcription/run_request.json", encoding="utf-8")).get("shard") or shard
              chunks = [{"shard": shard, "only": p["only"], "start": "", "end": ""}]
          else:
              chunks, a = [], p["start"]
              while a <= p["end"]:
                  b = min(a + p["chunk_size"] - 1, p["end"])
                  chunks.append({"shard": f"whisper_{a}_{b}", "only": "", "start": str(a), "end": str(b)})
                  a = b + 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"chunks={json.dumps(chunks)}\n")
              fh.write(f"model={p['model']}\nlanguage={p['language']}\nskip_existing={p['skip_existing']}\n")
          print("Chunks:", chunks)
          PY

  transcribe:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ needs.plan.outputs.model }}
      - run: pip install -r requirements.txt
      - name: Transcribe chunk ${{ matrix.chunk.shard }}
        env:
          MODEL: ${{ needs.plan.outputs.model }}
          LANGUAGE: ${{ needs.plan.outputs.language }}
          SKIP_EXISTING: ${{ needs.plan.outputs.skip_existing }}
          SHARD: ${{ matrix.chunk.shard }}
          ONLY: ${{ matrix.chunk.only }}
          START: ${{ matrix.chunk.start }}
          END: ${{ matrix.chunk.end }}
        run: |
          mkdir -p transcription/results
          ARGS="--model $MODEL --language $LANGUAGE --out transcription/results/$SHARD.jsonl"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; else ARGS="$ARGS --start $START --end $END"; fi
          if [ "$SKIP_EXISTING" = "true" ]; then ARGS="$ARGS --skip-existing"; fi
          echo "python3 transcription/transcribe.py $ARGS"
          python3 transcription/transcribe.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.chunk.shard }}
          path: transcription/results/${{ matrix.chunk.shard }}.jsonl
          if-no-files-found: warn

  collect:
    needs: [plan, transcribe]
    if: always() && needs.transcribe.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: transcription/results
          merge-multiple: true
      - name: Commit result shards back to this branch
        env:
          BRANCH: ${{ github.ref_name }}
          MODEL: ${{ needs.plan.outputs.model }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcription/results/*.jsonl
          if git diff --cached --quiet; then echo "No new results to commit"; exit 0; fi
          git commit -m "Add Whisper ($MODEL) Urdu ASR result shards [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 5))
          done
          echo "Push failed after retries"; exit 1
