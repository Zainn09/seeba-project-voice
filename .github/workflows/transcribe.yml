name: Transcribe voices (Whisper Urdu ASR)

# Manual batch speech-to-text. Each matrix job transcribes one chunk of
# voice numbers into transcription/results/<shard>.jsonl; the collect job
# commits all shards back to the branch this workflow was launched from.
# Originals in Voices/ and text_voices.docx are only ever read.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "faster-whisper model (tiny/base/small/medium/large-v3)"
        default: "small"
      start:
        description: "First voice number"
        default: "151"
      end:
        description: "Last voice number"
        default: "500"
      only:
        description: "Comma-separated voice numbers (overrides start/end; for tests)"
        default: ""
      chunk_size:
        description: "Voices per parallel job"
        default: "42"
      language:
        description: "ur = force Urdu, auto = detect"
        default: "ur"
      skip_existing:
        description: "Skip voices already transcribed in text_voices.docx (true/false)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: transcribe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - id: plan
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          ONLY: ${{ inputs.only }}
          CHUNK: ${{ inputs.chunk_size }}
        run: |
          python3 - <<'PY'
          import json, os
          only = os.environ.get("ONLY", "").strip()
          if only:
              chunks = [{"shard": "test_only", "only": only, "start": "", "end": ""}]
          else:
              start, end, size = int(os.environ["START"]), int(os.environ["END"]), int(os.environ["CHUNK"])
              chunks = []
              a = start
              while a <= end:
                  b = min(a + size - 1, end)
                  chunks.append({"shard": f"whisper_{a}_{b}", "only": "", "start": str(a), "end": str(b)})
                  a = b + 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"chunks={json.dumps(chunks)}\n")
          print(chunks)
          PY

  transcribe:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.model }}
      - run: pip install -r requirements.txt
      - name: Transcribe chunk ${{ matrix.chunk.shard }}
        env:
          MODEL: ${{ inputs.model }}
          LANGUAGE: ${{ inputs.language }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
          SHARD: ${{ matrix.chunk.shard }}
          ONLY: ${{ matrix.chunk.only }}
          START: ${{ matrix.chunk.start }}
          END: ${{ matrix.chunk.end }}
        run: |
          mkdir -p transcription/results
          ARGS="--model $MODEL --language $LANGUAGE --out transcription/results/$SHARD.jsonl"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; else ARGS="$ARGS --start $START --end $END"; fi
          if [ "$SKIP_EXISTING" = "true" ]; then ARGS="$ARGS --skip-existing"; fi
          echo "python3 transcription/transcribe.py $ARGS"
          python3 transcription/transcribe.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.chunk.shard }}
          path: transcription/results/${{ matrix.chunk.shard }}.jsonl
          if-no-files-found: warn

  collect:
    needs: transcribe
    if: always() && needs.transcribe.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: transcription/results
          merge-multiple: true
      - name: Commit result shards back to this branch
        env:
          BRANCH: ${{ github.ref_name }}
          MODEL: ${{ inputs.model }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcription/results/*.jsonl
          if git diff --cached --quiet; then echo "No new results to commit"; exit 0; fi
          git commit -m "Add Whisper ($MODEL) Urdu ASR result shards [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 5))
          done
          echo "Push failed after retries"; exit 1
